# Keeps the live demo awake through judging: wakes the backend (which also syncs with Supabase,
# and free Supabase projects pause after a week with no activity).
# Repo secret needed: LIVE_URL = the Cloudflare Pages address, e.g. https://lifespace.pages.dev
name: keepalive
on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ secrets.LIVE_URL }}
    steps:
      - name: Wake the app
        run: |
          if [ -z "$LIVE_URL" ]; then echo "LIVE_URL secret not set"; exit 0; fi
          curl -fsS --max-time 120 "$LIVE_URL/api/health"
          curl -fsS --max-time 120 "$LIVE_URL/api/spaces" -o /dev/null
