# Keeps the live demo awake through judging. Render's free plan sleeps after 15 minutes with no
# traffic and takes about a minute to wake, so this pings every 10 minutes. It also keeps Supabase
# active (free Supabase projects pause after a week with no activity).
# GitHub may run scheduled jobs a few minutes late; that's fine.
# Repo secret needed: LIVE_URL = the Cloudflare Pages address, e.g. https://lifespace.pages.dev
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      LIVE_URL: ${{ secrets.LIVE_URL }}
    steps:
      - name: Wake the app
        run: |
          if [ -z "$LIVE_URL" ]; then echo "LIVE_URL secret not set"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 "$LIVE_URL/api/health"
