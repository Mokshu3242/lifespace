# Builds the backend image (Python, OpenCV, OCR already installed) and keeps it in GitHub's free
# package registry, so the big jobs below start in seconds instead of installing everything.
name: backend image
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/mokshu3242/lifespace-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
